name: Build Meeting Translator Installer

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/meeting-realtime-translator-6e16
      - cursor/fix-text-translate-gemini-6e16
      - cursor/package-v1.4.2-6e16
      - cursor/app-v1.5-features-6e16
      - cursor/offline-live-caption-6e16
      - main
    paths:
      - "meeting-translator/**"
      - ".github/workflows/build-meeting-translator-installer.yml"
    tags:
      - "meeting-translator-v*"

permissions:
  contents: write

concurrency:
  group: meeting-translator-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: meeting-translator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Whisper model (build)
        uses: actions/cache@v4
        with:
          path: meeting-translator/runtime/whisper-models
          key: whisper-small-${{ hashFiles('meeting-translator/backend/requirements.txt', 'meeting-translator/scripts/download_whisper_model.py') }}
          restore-keys: |
            whisper-small-

      - name: Bundle Python, FFmpeg, Whisper
        shell: pwsh
        timeout-minutes: 45
        run: |
          ./scripts/bundle-python.ps1
          ./scripts/bundle-ffmpeg.ps1
          ./scripts/bundle-whisper.ps1 -Model "small"

      - name: Build portable package (Whisper bundled)
        shell: pwsh
        timeout-minutes: 50
        run: ./pack-portable.ps1 -SkipRuntimeBundle

      - name: Build NSIS Setup.exe (optional)
        shell: pwsh
        timeout-minutes: 90
        continue-on-error: true
        run: |
          Push-Location desktop
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run dist:win
          Pop-Location
          $exe = Get-ChildItem dist\desktop -Filter "Meeting-Translator-Setup-*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "dist\$($exe.Name)" -Force
          }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION.txt -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package release zip
        shell: pwsh
        run: ./pack-v1.4.2.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $portable = "dist\Meeting-Translator-v$v-Portable.zip"
          $setup = "dist\Meeting-Translator-Setup-$v.exe"
          if (-not (Test-Path $portable) -and -not (Test-Path $setup)) {
            throw "Khong co Portable.zip hay Setup.exe — khong the phat hanh"
          }
          if (Test-Path $portable) { Write-Host "OK: $portable" }
          if (Test-Path $setup) { Write-Host "OK: $setup" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meeting-Translator-v${{ steps.ver.outputs.version }}
          path: |
            meeting-translator/dist/Meeting-Translator-Setup-*.exe
            meeting-translator/dist/Meeting-Translator-v*-Portable.zip
            meeting-translator/dist/Meeting-Translator-v*-Full-Package.zip
            meeting-translator/dist/Meeting-Translator-v*-BAT-scripts.zip
            meeting-translator/dist/desktop/Meeting-Translator-Setup-*.exe
            meeting-translator/dist/release/**
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/meeting-translator-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meeting-translator-v${{ steps.ver.outputs.version }}
          name: Meeting Translator v${{ steps.ver.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            meeting-translator/dist/Meeting-Translator-v${{ steps.ver.outputs.version }}-Portable.zip
            meeting-translator/dist/Meeting-Translator-Setup-${{ steps.ver.outputs.version }}.exe
            meeting-translator/dist/Meeting-Translator-v${{ steps.ver.outputs.version }}-Full-Package.zip
            meeting-translator/dist/Meeting-Translator-v${{ steps.ver.outputs.version }}-BAT-scripts.zip
            meeting-translator/dist/Meeting-Translator-BAT-scripts.zip
            meeting-translator/CAI-BANG-EXE.bat
            meeting-translator/MO-APP.bat
            meeting-translator/CAU-HINH-API-KEY.bat
            meeting-translator/CHAY-PORTABLE.bat
            meeting-translator/BAT-HUONG-DAN.txt
            meeting-translator/TAI-BAN-CAI-DAT.txt
            meeting-translator/HUONG_DAN_CAI_DAT.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
