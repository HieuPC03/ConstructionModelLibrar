name: Build Meeting Translator Installer

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/meeting-realtime-translator-6e16
      - cursor/fix-text-translate-gemini-6e16
      - cursor/package-v1.4.2-6e16
      - cursor/app-v1.5-features-6e16
      - main
    paths:
      - "meeting-translator/**"
      - ".github/workflows/build-meeting-translator-installer.yml"
    tags:
      - "meeting-translator-v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: meeting-translator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build installer
        shell: pwsh
        run: ./pack-desktop.ps1

      - name: Package v1.4.2 release
        shell: pwsh
        run: ./pack-v1.4.2.ps1 -Version "1.5.0"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meeting-Translator-v1.5.0
          path: |
            meeting-translator/dist/Meeting-Translator-Setup-*.exe
            meeting-translator/dist/Meeting-Translator-v*-Full-Package.zip
            meeting-translator/dist/Meeting-Translator-v*-BAT-scripts.zip
            meeting-translator/dist/desktop/Meeting-Translator-Setup-*.exe
            meeting-translator/dist/release/**
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/meeting-translator-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meeting-translator-v1.5.0
          name: Meeting Translator v1.5.0
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Meeting-Translator-Setup-1.5.0.exe
            dist/Meeting-Translator-v1.5.0-Full-Package.zip
            dist/Meeting-Translator-v1.5.0-BAT-scripts.zip
            dist/Meeting-Translator-BAT-scripts.zip
            CAI-BANG-EXE.bat
            MO-APP.bat
            CAU-HINH-API-KEY.bat
            BAT-HUONG-DAN.txt
            TAI-BAN-CAI-DAT.txt
            HUONG_DAN_CAI_DAT.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
