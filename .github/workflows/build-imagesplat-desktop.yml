name: Build Desktop Installer

on:
  push:
    branches: [cursor/desktop-installer-6a40, main]
    paths:
      - 'ImageSplatStudio/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Windows installer
        shell: pwsh
        run: |
          cd ImageSplatStudio
          .\build-desktop.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSplatStudio-Setup-Windows
          path: ImageSplatStudio/desktop/dist-installer/*.exe
          retention-days: 90

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Linux AppImage
        run: |
          cd ImageSplatStudio/frontend && npm install && npm run build
          cd ../desktop && npm install && npm run dist:linux

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageSplatStudio-AppImage-Linux
          path: ImageSplatStudio/desktop/dist-installer/*.AppImage
          retention-days: 90
